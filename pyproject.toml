[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "donutloc"
version = "0.1.0"
description = "Simulation of fluorescent-emitter localization with structured donut beams (MINFLUX-type)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "flor-choque"}]
dependencies = ["numpy>=1.20", "scipy>=1.6", "matplotlib>=3.3"]

[project.optional-dependencies]
fast = ["numba>=0.55"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
